name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "version-*"]
  workflow_dispatch:   # manual trigger button on GitHub Actions page

permissions:
  contents: read

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        if: matrix.python-version != '3.8' && matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: scripts/install

      - name: Install dependencies (Python 3.8-3.10)
        if: matrix.python-version == '3.8' || matrix.python-version == '3.9' || matrix.python-version == '3.10'
        run: scripts/install-py38

      - name: Run linting checks
        if: matrix.python-version != '3.8' && matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: scripts/check

      - name: Build package
        if: matrix.python-version != '3.8' && matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: scripts/build

      - name: Run tests
        if: matrix.python-version != '3.8' && matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: scripts/test

      - name: Run tests (Python 3.8-3.10)
        if: matrix.python-version == '3.8' || matrix.python-version == '3.9' || matrix.python-version == '3.10'
        run: .venv/bin/python -m coverage run -m pytest

      - name: Enforce coverage
        if: matrix.python-version != '3.8' && matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: scripts/coverage

      - name: Enforce coverage (Python 3.8-3.10)
        if: matrix.python-version == '3.8' || matrix.python-version == '3.9' || matrix.python-version == '3.10'
        run: .venv/bin/python -m coverage report --show-missing --skip-covered --fail-under=100

      - name: Upload dist
        if: matrix.python-version == '3.15'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  check:
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
